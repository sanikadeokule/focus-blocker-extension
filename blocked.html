<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Blocked — Focus Mode</title>
  <link rel="stylesheet" href="blocked.css" />
</head>
<body>
  <main class="card">
    <div class="emoji">🛡️</div>
    <h1>Not today.</h1>
    <p class="msg" id="msg">You blocked this site for a reason. Future-you will thank present-you.</p>
    <div class="stats">
      <span id="count">0</span> blocks this week ·
      <span id="streak">0</span> day streak 🔥
    </div>
    <div class="actions">
      <button id="back">← Go back</button>
      <button id="study" class="primary">Open something useful</button>
    </div>
    <p class="footer">Focus Blocker · you got this, Sanika</p>
  </main>
  <script src="blocked.js"></script>
</body>
</html>
